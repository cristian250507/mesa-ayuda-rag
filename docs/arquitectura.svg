<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#37474F"/>
    </marker>
    <marker id="fl2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#C62828"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#FFFFFF"/>
  <text x="590" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#102A43">Arquitectura de Solución — Mesa de Ayuda Académica Inteligente (LLM + RAG)</text>
  <text x="590" y="58" text-anchor="middle" font-size="13" fill="#5B6B7C">ISY0101 · Ingeniería de Soluciones con IA · Evaluación Parcial 1</text>

  <!-- FASE A: INDEXACIÓN -->
  <rect x="25" y="82" width="530" height="300" rx="10" fill="#F3F7FB" stroke="#B7C7D6" stroke-dasharray="5 4"/>
  <text x="42" y="104" font-size="13" font-weight="bold" fill="#37516B">FASE A — INDEXACIÓN (offline, ejecución única)</text>

  <rect x="45" y="120" width="145" height="58" rx="7" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="117" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D3C6E">Fuentes INTERNAS</text>
  <text x="117" y="158" text-anchor="middle" font-size="10" fill="#37516B">Reglamento · Calendario</text>
  <text x="117" y="170" text-anchor="middle" font-size="10" fill="#37516B">FAQ Mesa de Ayuda</text>

  <rect x="45" y="190" width="145" height="58" rx="7" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="117" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Fuentes EXTERNAS</text>
  <text x="117" y="228" text-anchor="middle" font-size="10" fill="#37516B">Normativa de beneficios</text>
  <text x="117" y="240" text-anchor="middle" font-size="10" fill="#37516B">Reconoc. de aprendizajes</text>

  <rect x="228" y="120" width="140" height="62" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="298" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#102A43">1· Ingesta</text>
  <text x="298" y="157" text-anchor="middle" font-size="9.5" fill="#5B6B7C">PyPDFLoader / TextLoader</text>
  <text x="298" y="171" text-anchor="middle" font-size="9.5" fill="#C62828">+ metadato de origen</text>

  <rect x="228" y="196" width="140" height="62" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="298" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#102A43">2· Chunking</text>
  <text x="298" y="233" text-anchor="middle" font-size="9.5" fill="#5B6B7C">RecursiveCharacterTextSplitter</text>
  <text x="298" y="247" text-anchor="middle" font-size="9.5" fill="#5B6B7C">size=800 · overlap=120</text>

  <rect x="228" y="272" width="140" height="58" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="298" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#102A43">3· Embeddings</text>
  <text x="298" y="309" text-anchor="middle" font-size="9.5" fill="#5B6B7C">text-embedding-3-small</text>
  <text x="298" y="322" text-anchor="middle" font-size="9.5" fill="#5B6B7C">vía GitHub Models</text>

  <rect x="405" y="196" width="130" height="90" rx="7" fill="#FFF8E1" stroke="#EF6C00" stroke-width="1.6"/>
  <text x="470" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A4B00">Vector Store</text>
  <text x="470" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#EF6C00">FAISS</text>
  <text x="470" y="264" text-anchor="middle" font-size="9.5" fill="#5B6B7C">chunks + vectores</text>
  <text x="470" y="276" text-anchor="middle" font-size="9.5" fill="#5B6B7C">+ metadatos</text>

  <path d="M190 149 L226 149" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M190 219 L210 219 L210 160 L226 160" stroke="#37474F" fill="none" marker-end="url(#fl)"/>
  <path d="M298 182 L298 194" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M298 258 L298 270" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M368 300 L388 300 L388 241 L403 241" stroke="#37474F" fill="none" marker-end="url(#fl)"/>

  <!-- FASE B: CONSULTA -->
  <rect x="580" y="82" width="575" height="510" rx="10" fill="#FAF6FB" stroke="#C9B7D6" stroke-dasharray="5 4"/>
  <text x="597" y="104" font-size="13" font-weight="bold" fill="#5B3A72">FASE B — CONSULTA EN TIEMPO REAL</text>

  <rect x="600" y="118" width="128" height="52" rx="7" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="664" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#3F2A6B">Estudiante</text>
  <text x="664" y="156" text-anchor="middle" font-size="9.5" fill="#5B6B7C">consulta en lenguaje natural</text>

  <rect x="596" y="186" width="136" height="80" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="664" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#102A43">6· Memoria</text>
  <text x="664" y="224" text-anchor="middle" font-size="8.5" fill="#5B6B7C">BufferWindowMemory k=5</text>
  <text x="664" y="240" text-anchor="middle" font-size="8.5" fill="#5B6B7C">SummaryMemory (&gt;10 turnos)</text>
  <text x="664" y="256" text-anchor="middle" font-size="8.5" fill="#5B6B7C">control de contexto</text>

  <rect x="778" y="118" width="150" height="66" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="853" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#102A43">Reformulación</text>
  <text x="853" y="153" text-anchor="middle" font-size="9" fill="#5B6B7C">Prompt Chaining: convierte</text>
  <text x="853" y="165" text-anchor="middle" font-size="9" fill="#5B6B7C">la pregunta de seguimiento</text>
  <text x="853" y="177" text-anchor="middle" font-size="9" fill="#5B6B7C">en consulta autocontenida</text>

  <rect x="778" y="210" width="150" height="72" rx="7" fill="#FFFFFF" stroke="#C62828" stroke-width="1.6"/>
  <text x="853" y="230" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8C1C1C">4· RETRIEVE</text>
  <text x="853" y="245" text-anchor="middle" font-size="9" fill="#5B6B7C">similarity_search_with_score</text>
  <text x="853" y="257" text-anchor="middle" font-size="9" fill="#5B6B7C">top_k = 4</text>
  <text x="853" y="271" text-anchor="middle" font-size="9" font-weight="bold" fill="#C62828">umbral de similitud (corte)</text>

  <rect x="778" y="310" width="150" height="66" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="853" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#102A43">5· AUGMENT</text>
  <text x="853" y="345" text-anchor="middle" font-size="9" fill="#5B6B7C">bloque CONTEXTO delimitado</text>
  <text x="853" y="357" text-anchor="middle" font-size="9" fill="#5B6B7C">[FUENTE | TIPO | PÁG | SIM]</text>
  <text x="853" y="369" text-anchor="middle" font-size="9" fill="#5B6B7C">+ historial + pregunta</text>

  <rect x="600" y="310" width="150" height="120" rx="7" fill="#E1F5FE" stroke="#0277BD" stroke-width="1.6"/>
  <text x="675" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#01466B">Prompt Engineering</text>
  <text x="612" y="350" font-size="9" fill="#37516B">· Role prompting</text>
  <text x="612" y="364" font-size="9" fill="#37516B">· Few-shot (3 ejemplos)</text>
  <text x="612" y="378" font-size="9" fill="#37516B">· Chain-of-Thought oculto</text>
  <text x="612" y="392" font-size="9" fill="#37516B">· Salida JSON estricta</text>
  <text x="612" y="406" font-size="9" fill="#37516B">· Anti prompt-injection</text>
  <text x="612" y="420" font-size="9" fill="#37516B">· "no asumas / usa estrictamente"</text>

  <rect x="778" y="404" width="150" height="70" rx="7" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.6"/>
  <text x="853" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8A4B00">7· GENERATE</text>
  <text x="853" y="440" text-anchor="middle" font-size="9.5" fill="#5B6B7C">ChatOpenAI · GitHub Models</text>
  <text x="853" y="453" text-anchor="middle" font-size="9.5" fill="#5B6B7C">temperature = 0.1</text>
  <text x="853" y="466" text-anchor="middle" font-size="9.5" fill="#5B6B7C">max_tokens = 700</text>

  <rect x="962" y="404" width="170" height="70" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="1047" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#102A43">8· Post-procesamiento</text>
  <text x="1047" y="440" text-anchor="middle" font-size="9" fill="#5B6B7C">validación del JSON</text>
  <text x="1047" y="452" text-anchor="middle" font-size="9" fill="#5B6B7C">respuesta sin fuente → se degrada</text>
  <text x="1047" y="465" text-anchor="middle" font-size="9" fill="#5B6B7C">flag derivar_a_humano</text>

  <rect x="962" y="192" width="170" height="90" rx="7" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="1047" y="213" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3F2A6B">Respuesta trazable</text>
  <text x="978" y="231" font-size="9" fill="#37516B">· texto ≤120 palabras</text>
  <text x="978" y="245" font-size="9" fill="#37516B">· fuentes citadas</text>
  <text x="978" y="259" font-size="9" fill="#37516B">· nivel_confianza</text>
  <text x="978" y="273" font-size="9" fill="#37516B">· derivar_a_humano</text>

  <rect x="962" y="310" width="170" height="66" rx="7" fill="#FFEBEE" stroke="#C62828"/>
  <text x="1047" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#8C1C1C">Salida segura</text>
  <text x="1047" y="347" text-anchor="middle" font-size="9" fill="#5B6B7C">sin contexto sobre el umbral</text>
  <text x="1047" y="359" text-anchor="middle" font-size="9" fill="#5B6B7C">→ NO se invoca al LLM</text>
  <text x="1047" y="371" text-anchor="middle" font-size="9" fill="#5B6B7C">→ derivación a ejecutivo</text>

  <path d="M664 170 L664 184" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M728 144 L776 144" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M732 214 L754 214 L754 170 L776 170" stroke="#37474F" fill="none" marker-end="url(#fl)"/>
  <path d="M853 184 L853 208" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M853 282 L853 308" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M853 376 L853 402" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M750 370 L776 355" stroke="#0277BD" fill="none" marker-end="url(#fl)"/>
  <path d="M928 439 L960 439" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M1047 402 L1047 286" stroke="#37474F" marker-end="url(#fl)"/>
  <path d="M928 250 L960 330" stroke="#C62828" fill="none" marker-end="url(#fl2)"/>
  <path d="M962 272 L940 296 L680 296 L664 270" stroke="#5E35B1" fill="none" stroke-dasharray="4 3" marker-end="url(#fl)"/>
  <text x="748" y="293" font-size="8.5" fill="#5E35B1">respuesta → memoria</text>

  <!-- conexión FAISS -> retrieve -->
  <path d="M535 241 L566 241 L566 176 L758 176 L758 232 L776 232" stroke="#EF6C00" fill="none" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="574" y="171" font-size="8.5" fill="#EF6C00">contexto recuperado</text>

  <!-- FASE C: EVALUACIÓN -->
  <rect x="25" y="410" width="530" height="182" rx="10" fill="#F1F8F2" stroke="#B0CDB4" stroke-dasharray="5 4"/>
  <text x="42" y="432" font-size="13" font-weight="bold" fill="#1B5E20">FASE C — EVALUACIÓN Y MEJORA CONTINUA (9)</text>

  <rect x="45" y="446" width="232" height="62" rx="7" fill="#FFFFFF" stroke="#2E7D32"/>
  <text x="161" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">Métricas de RECUPERACIÓN</text>
  <text x="161" y="483" text-anchor="middle" font-size="9.5" fill="#5B6B7C">Context Precision</text>
  <text x="161" y="497" text-anchor="middle" font-size="9.5" fill="#5B6B7C">Context Recall</text>

  <rect x="297" y="446" width="232" height="62" rx="7" fill="#FFFFFF" stroke="#2E7D32"/>
  <text x="413" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">Métricas de GENERACIÓN</text>
  <text x="413" y="483" text-anchor="middle" font-size="9.5" fill="#5B6B7C">Faithfulness</text>
  <text x="413" y="497" text-anchor="middle" font-size="9.5" fill="#5B6B7C">Answer Relevancy</text>

  <rect x="45" y="520" width="484" height="54" rx="7" fill="#FFFFFF" stroke="#37474F"/>
  <text x="287" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#102A43">Conjunto dorado (20 preguntas) + trazas en LangSmith</text>
  <text x="287" y="559" text-anchor="middle" font-size="9.5" fill="#5B6B7C">Permite aislar si el fallo es del Retriever o del Generator y optimizar de forma iterativa</text>

  <path d="M853 474 L853 500 L560 500 L560 490 L531 490" stroke="#2E7D32" fill="none" stroke-dasharray="4 3" marker-end="url(#fl)"/>
  <path d="M45 547 L34 547 L34 301 L226 301" stroke="#2E7D32" fill="none" stroke-dasharray="4 3" marker-end="url(#fl)"/>
  <text x="46" y="602" font-size="9" fill="#2E7D32">El resultado de la evaluación realimenta el ajuste de chunk_size, top_k, umbral y prompts</text>

  <!-- Leyenda -->
  <rect x="25" y="618" width="1107" height="120" rx="10" fill="#FCFCFD" stroke="#D8DEE6"/>
  <text x="42" y="640" font-size="12" font-weight="bold" fill="#102A43">Reglas arquitectónicas aplicadas</text>
  <text x="42" y="661" font-size="10" fill="#37516B">1. El nombre del documento de origen se adjunta como metadato desde la ingesta, para garantizar la trazabilidad de los datos en toda la cadena.</text>
  <text x="42" y="679" font-size="10" fill="#37516B">2. Los puntajes de similitud se calculan ANTES de inyectar el contexto en el prompt; si ninguno supera el umbral, el generador no se invoca.</text>
  <text x="42" y="697" font-size="10" fill="#37516B">3. El contenido recuperado se trata como DATO, nunca como instrucción, para mitigar ataques de prompt injection alojados en los documentos.</text>
  <text x="42" y="715" font-size="10" fill="#37516B">4. Ninguna respuesta afirmativa puede emitirse sin al menos una fuente citada: el post-procesamiento la degrada a derivación humana.</text>
  <text x="42" y="733" font-size="10" fill="#37516B">5. Fuentes internas y externas comparten pipeline e índice, pero se distinguen por el metadato "tipo" para resolver contradicciones normativas.</text>
</svg>
